<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Fuel Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#d9dee5;--ac:#1f6feb;--hd:#e9edf3;--wk:#f1f4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1a2029;--tx:#e6eaf0;--mut:#8f9aab;--bd:#2c3542;--ac:#5b9dff;--hd:#232b37;--wk:#1f2631}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1a2029;--tx:#e6eaf0;--mut:#8f9aab;--bd:#2c3542;--ac:#5b9dff;--hd:#232b37;--wk:#1f2631}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 8px}
h1{margin:0 0 2px;font-size:20px}
header p{margin:0;color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;align-items:center}
input,button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.stat{margin-left:auto;color:var(--mut)}.stat b{color:var(--tx)}
.wrap{margin:0 16px 24px;overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--bd);border-radius:8px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--hd);z-index:3;padding:6px 4px;font-size:12px}
tfoot td{position:sticky;bottom:0;background:var(--hd);z-index:3;font-weight:600;padding:6px 4px}
.c1,.c2,.c3{position:sticky;background:var(--card);z-index:2;text-align:left;padding:4px 8px}
thead .c1,thead .c2,thead .c3,tfoot .c1,tfoot .c2,tfoot .c3{background:var(--hd);z-index:4}
.c1{left:0;min-width:92px;font-weight:600}.c2{left:92px;min-width:120px;color:var(--mut)}.c3{left:212px;min-width:70px;color:var(--mut);font-size:12px;border-right:2px solid var(--bd)}
td input{width:54px;border:0;border-radius:0;background:transparent;text-align:right;padding:6px 4px}
td input:focus{outline:2px solid var(--ac);outline-offset:-2px;background:var(--card)}
td.wk{background:var(--wk)}td.wk input{background:transparent}
.tot{min-width:70px;font-weight:600;padding:4px 8px;background:var(--hd)}
.hide{display:none}td.od{padding:6px;min-width:70px;text-align:right;color:var(--mut)}tr.or>td{border-bottom:2px solid var(--bd)}
</style></head><body>
<header><h1>Vehicle Fuel Log</h1><p>Enter liters per day and each vehicle's km/L; distance is computed (liters × km/L). Saved automatically in this browser. Use Export CSV to keep a copy.</p></header>
<div class="bar">
<input type="month" id="month">
<input type="search" id="q" placeholder="Search vehicle or plate…">
<button id="exp" class="p">Export CSV</button>
<button id="imp">Import CSV</button><input type="file" id="file" accept=".csv" class="hide">
<button id="clr">Clear month</button>
<span class="stat"><b id="gt">0</b> L · <b id="gk">0</b> km · <b id="ge">–</b> km/L</span>
</div>
<div class="wrap"><table id="t"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
<script>
const RAW=`F5-334 N/A
F5-372 N/A
F16-111 N/A
F16-208 N/A

F16-215 N/A
G1-200 N/A

T1-106 N/A
T1-107 N/A`;
const V=RAW.split("\n").map(l=>{const s=l.trim().split(/\s+/);return{id:s[0],plate:s.slice(1).join(" ")}});
const $=s=>document.querySelector(s),mEl=$("#month");
let data={},days=30;
const key=()=>"fuel:"+mEl.value;
const load=()=>{try{data=JSON.parse(localStorage.getItem(key()))||{}}catch(e){data={}}};
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(data))}catch(e){}};
const num=x=>{const n=parseFloat(x);return isNaN(n)?0:n};
const fmt=n=>Math.round(n*100)/100;
function build(){
 const pre="";const [y,m]=mEl.value.split("-").map(Number);days=new Date(y,m,0).getDate();load();
 let h='<tr><th class="c1">Vehicle</th><th class="c2">Plate</th><th class="c3"></th>',f='<tr><td class="c1">Total</td><td class="c2"></td><td class="c3">Fuel (L)</td>';
 for(let d=1;d<=days;d++){h+=`<th>${d}</th>`;f+=`<td id="ct${d}">0</td>`}
 h+='<th>Liters</th><th>km/L</th><th>Distance (km)</th><th>Start odo</th><th>End odo</th></tr>';f+='<td id="gt2">0</td><td id="ge2"></td><td id="gk2">0</td><td></td><td></td></tr>';
 $("thead").innerHTML=h;$("tfoot").innerHTML=f;
 let b="";
 V.forEach((v,i)=>{let ob="";const sk=(v.id+" "+v.plate).toLowerCase();b+=`<tr data-i="${i}" data-s="${sk}"><td class="c1" rowspan="2">${v.id}</td><td class="c2" rowspan="2">${v.plate}</td><td class="c3">Fuel (L)</td>`;
  for(let d=1;d<=days;d++){const w=[0,6].includes(new Date(y,m-1,d).getDay());const val=(data[v.id]||{})[pre+d];
   b+=`<td class="${w?"wk":""}"><input type="number" step="any" min="0" inputmode="decimal" data-v="${v.id}" data-d="${pre+d}" value="${val??""}"></td>`;ob+=`<td class="${w?"wk":""} od" id="o${i}_${d}"></td>`}
  b+=`<td class="tot" rowspan="2" id="rt${i}"></td><td class="tot" rowspan="2"><input type="number" step="any" min="0" inputmode="decimal" data-v="${v.id}" data-d="e" value="${(data[v.id]||{}).e??""}"></td><td class="tot" rowspan="2" id="rk${i}"></td><td class="tot" rowspan="2"><input type="number" step="any" min="0" inputmode="decimal" data-v="${v.id}" data-d="o" value="${(data[v.id]||{}).o??""}"></td><td class="tot" rowspan="2" id="re${i}"></td></tr><tr class="or" data-s="${sk}"><td class="c3">Odometer</td>${ob}</tr>`});
 $("tbody").innerHTML=b;totals();filter();
}
function totals(){
 let g=0,gk=0,gl=0;const ct=Array(days+1).fill(0);
 V.forEach((v,i)=>{let l=0;const o=data[v.id]||{},e=num(o.e),hs=o.o!==undefined&&o.o!=="";let cum=num(o.o);
  for(let d=1;d<=days;d++){const a=num(o[d]);l+=a;cum+=a*e;ct[d]+=a;const c=$("#o"+i+"_"+d);if(c)c.textContent=hs&&e?fmt(cum):""}
  const k=l*e;g+=l;gk+=k;if(k)gl+=l;
  $("#rt"+i).textContent=l?fmt(l):"";$("#rk"+i).textContent=k?fmt(k):"";$("#re"+i).textContent=hs&&k?fmt(num(o.o)+k):""});
 for(let d=1;d<=days;d++)$("#ct"+d).textContent=ct[d]?fmt(ct[d]):"";
 const fe=gk?fmt(gk/gl):"–";$("#gt2").textContent=fmt(g);$("#gt").textContent=fmt(g);$("#gk2").textContent=fmt(gk);$("#gk").textContent=fmt(gk);$("#ge").textContent=fe;$("#ge2").textContent=gk?fe:"";
}
function filter(){const q=$("#q").value.trim().toLowerCase();document.querySelectorAll("tbody tr").forEach(r=>r.classList.toggle("hide",q&&!r.dataset.s.includes(q)))}
$("tbody").addEventListener("input",e=>{const t=e.target;if(!t.dataset.v)return;
 const o=data[t.dataset.v]=data[t.dataset.v]||{};
 if(t.value==="")delete o[t.dataset.d];else o[t.dataset.d]=t.value;
 save();totals()});
$("#q").addEventListener("input",filter);
mEl.addEventListener("change",build);
$("#clr").onclick=()=>{if(confirm("Clear all fuel entries for "+mEl.value+"?")){data={};save();build()}};
$("#exp").onclick=()=>{
 let c="Vehicle,Plate,"+Array.from({length:days},(_,i)=>i+1).join(",")+",Total L,km/L,Distance km,Start odo,End odo\n";
 V.forEach(v=>{const o=data[v.id]||{};let l=0;const r=[];for(let d=1;d<=days;d++){r.push(o[d]??"");l+=num(o[d])}
  c+=`"${v.id}","${v.plate}",${r.join(",")},${fmt(l)},${o.e??""},${o.e?fmt(l*num(o.e)):""},${o.o??""},${o.o&&o.e?fmt(num(o.o)+l*num(o.e)):""}\n`});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="fuel-"+mEl.value+".csv";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const L=r.result.trim().split(/\r?\n/).slice(1);data={};
  L.forEach(l=>{const c=l.match(/("([^"]*)"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,""));
   const id=c[0];for(let d=1;d<=days;d++){if(c[1+d]!==undefined&&c[1+d]!=="")(data[id]=data[id]||{})[d]=c[1+d]}const e=c[days+3],oo=c[days+5];if(e)(data[id]=data[id]||{}).e=e;if(oo)(data[id]=data[id]||{}).o=oo});
  save();build()};r.readAsText(f);e.target.value=""};
const n=new Date();mEl.value=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");build();
</script></body></html>
